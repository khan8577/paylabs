name: CI-CD

on:
  push:
    branches: ["dev"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend install and test
        working-directory: backend
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: |
          npm ci
          npm test

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  build-and-push:
    runs-on: ubuntu-latest
    needs: test-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: frontend
            context: ./frontend
          - service: backend
            context: ./backend
          - service: redis
            context: ./redis
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/paylabs-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/paylabs-${{ matrix.service }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update image references
        run: |
          sed -i "s|ghcr.io/your-org/paylabs-frontend:latest|ghcr.io/${{ github.repository_owner }}/paylabs-frontend:${{ github.sha }}|g" k8s/base/frontend-deployment.yaml
          sed -i "s|ghcr.io/your-org/paylabs-backend:latest|ghcr.io/${{ github.repository_owner }}/paylabs-backend:${{ github.sha }}|g" k8s/base/backend-deployment.yaml
          sed -i "s|ghcr.io/your-org/paylabs-redis:latest|ghcr.io/${{ github.repository_owner }}/paylabs-redis:${{ github.sha }}|g" k8s/base/redis-deployment.yaml

      - name: Deploy to Kubernetes
        run: kubectl apply -k k8s/base

      - name: Verify rollout
        run: |
          kubectl -n paylabs rollout status deployment/frontend --timeout=120s
          kubectl -n paylabs rollout status deployment/backend --timeout=120s
          kubectl -n paylabs rollout status deployment/redis --timeout=120s
