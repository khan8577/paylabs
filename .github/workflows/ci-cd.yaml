name: CI-CD

on:
  push:
    branches: ["dev"]

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 197377640327.dkr.ecr.ap-south-1.amazonaws.com
  KUBE_NAMESPACE: paylabs
  KUBECONFIG_PATH: /root/.kube/config

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend install and test
        working-directory: backend
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: |
          npm ci
          npm test

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  build-and-push:
    runs-on: ubuntu-latest
    needs: test-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    strategy:
      matrix:
        include:
          - service: frontend
            context: ./frontend
            repo: paylabs-frontend
          - service: backend
            context: ./backend
            repo: paylabs-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ matrix.repo }}:latest
            ${{ env.ECR_REGISTRY }}/${{ matrix.repo }}:${{ github.sha }}

  deploy:
    runs-on: self-hosted
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify kubectl + kubeconfig (self-hosted runner)
        run: |
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "USER=$(whoami)"
          echo "HOME=$HOME"
          which kubectl
          kubectl version --client
          test -f "${KUBECONFIG_PATH}" && echo "KUBECONFIG exists: ${KUBECONFIG_PATH}" || (echo "Missing kubeconfig at ${KUBECONFIG_PATH}" && exit 1)
          KUBECONFIG="${KUBECONFIG_PATH}" kubectl config view --minify --raw | sed -n 's/ *server: //p'
          KUBECONFIG="${KUBECONFIG_PATH}" kubectl get nodes -o wide

      - name: Update image references to ECR (commit SHA)
        run: |
          sed -i "s|image: .*paylabs-frontend:.*|image: ${{ env.ECR_REGISTRY }}/paylabs-frontend:${{ github.sha }}|g" k8s/base/frontend-deployment.yaml
          sed -i "s|image: .*paylabs-backend:.*|image: ${{ env.ECR_REGISTRY }}/paylabs-backend:${{ github.sha }}|g" k8s/base/backend-deployment.yaml

      - name: Apply manifests
        run: |
          export KUBECONFIG="${KUBECONFIG_PATH}"
          kubectl apply -k k8s/base
          kubectl -n "${KUBE_NAMESPACE}" get pods -o wide

      - name: Wait for rollout
        run: |
          export KUBECONFIG="${KUBECONFIG_PATH}"
          kubectl -n "${KUBE_NAMESPACE}" rollout status deployment/frontend --timeout=300s
          kubectl -n "${KUBE_NAMESPACE}" rollout status deployment/backend --timeout=300s
          kubectl -n "${KUBE_NAMESPACE}" rollout status deployment/redis --timeout=300s

      - name: Debug on failure
        if: failure()
        run: |
          export KUBECONFIG="${KUBECONFIG_PATH}"
          kubectl -n "${KUBE_NAMESPACE}" get pods -o wide || true
          kubectl -n "${KUBE_NAMESPACE}" describe deploy frontend || true
          kubectl -n "${KUBE_NAMESPACE}" describe pods -l app=frontend || true
          kubectl -n "${KUBE_NAMESPACE}" logs -l app=frontend --tail=200 || true
          kubectl -n "${KUBE_NAMESPACE}" describe deploy backend || true
          kubectl -n "${KUBE_NAMESPACE}" describe pods -l app=backend || true
          kubectl -n "${KUBE_NAMESPACE}" logs -l app=backend --tail=200 || true
