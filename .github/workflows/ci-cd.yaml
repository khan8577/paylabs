name: CI-CD

on:
  push:
    branches: ["dev"]

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 197377640327.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend install and test
        working-directory: backend
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: |
          npm ci
          npm test

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  build-and-push:
    runs-on: ubuntu-latest
    needs: test-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    strategy:
      matrix:
        include:
          - service: frontend
            context: ./frontend
            repo: paylabs-frontend
          - service: backend
            context: ./backend
            repo: paylabs-backend

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Debug registry (optional)
        run: |
          echo "ECR_REGISTRY=${ECR_REGISTRY}"
          echo "AWS_REGION=${AWS_REGION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ matrix.repo }}:latest
            ${{ env.ECR_REGISTRY }}/${{ matrix.repo }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update image references to ECR
        run: |
          sed -i "s|image: .*paylabs-frontend:.*|image: ${{ env.ECR_REGISTRY }}/paylabs-frontend:${{ github.sha }}|g" k8s/base/frontend-deployment.yaml
          sed -i "s|image: .*paylabs-backend:.*|image: ${{ env.ECR_REGISTRY }}/paylabs-backend:${{ github.sha }}|g" k8s/base/backend-deployment.yaml

      - name: Deploy to Kubernetes
        run: kubectl apply -k k8s/base

      - name: Verify rollout
        run: |
          kubectl -n paylabs rollout status deployment/frontend --timeout=120s
          kubectl -n paylabs rollout status deployment/backend --timeout=120s
          kubectl -n paylabs rollout status deployment/redis --timeout=120s
